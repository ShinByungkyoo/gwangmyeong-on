<style>

*{box-sizing:border-box}

header{background:rgba(0,0,0,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}

/* 히어로 */
.hero{position:relative;overflow:hidden;min-height:340px;padding:56px 40px 44px;margin-bottom:26px;border:1px solid var(--line);border-radius:4px;

:root{--brand2:#0a5f8f;--grad:linear-gradient(135deg,#15A9D8,#1456c8);--glow:0 0 0 1px rgba(21,169,216,.35),0 10px 40px -10px rgba(21,169,216,.45);--ease:cubic-bezier(.2,.7,.2,1)}

header{background:rgba(2,10,15,.62);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,rgba(21,169,216,.6),rgba(255,255,255,.08) 40%,rgba(20,86,200,.5)) 1}

a.card:hover,.hov:hover{transform:translateY(-4px);border-color:rgba(21,169,216,.7);background:linear-gradient(145deg,rgba(21,169,216,.14),rgba(20,86,200,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.12),var(--glow)}
.ph{border-bottom:0;position:relative;padding-bottom:20px;margin-bottom:28px}

h1{font-size:clamp(1.6rem,4vw,2.1rem);background:linear-gradient(100deg,#fff 40%,#9fe2f7);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h1::after,h2::after{-webkit-text-fill-color:var(--brand)}

.btn{transition:transform .2s var(--ease),box-shadow .25s,background .2s,border-color .2s,color .2s;border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.04)}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 22px -8px rgba(21,169,216,.7)}

.p{background:linear-gradient(135deg,#4fd1ff,#15A9D8 60%,#2f8fe0);border-color:transparent;color:#000;box-shadow:0 6px 24px -8px rgba(21,169,216,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.p:hover:not(:disabled){background:#fff;border-color:transparent;color:#000}
.input{border-radius:10px;background:rgba(0,0,0,.4);transition:border-color .2s,box-shadow .2s}
.input:focus{box-shadow:0 0 0 3px rgba(21,169,216,.28)}
.badge{background:linear-gradient(135deg,rgba(21,169,216,.22),rgba(20,86,200,.14));box-shadow:0 0 12px -4px rgba(21,169,216,.6)}
.ok,.warn,.bad,.gray{box-shadow:none}.ok{background:var(--ok-soft)}.warn{background:var(--warn-soft)}.bad{background:var(--bad-soft)}.gray{background:rgba(255,255,255,.06)}

.grid{gap:16px}

/* 통계 원형 */
.grid.ctr>div{border:1px solid transparent;background:linear-gradient(#050e14,#050e14) padding-box,linear-gradient(135deg,rgba(21,169,216,.9),rgba(255,255,255,.12) 55%,rgba(20,86,200,.8)) border-box;box-shadow:0 0 30px -10px rgba(21,169,216,.55);transition:transform .35s var(--ease),box-shadow .35s}

/* 히어로 */
.hero{border-radius:20px;border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px -40px rgba(21,169,216,.7),inset 0 1px 0 rgba(255,255,255,.1);

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
const fmt = iso => iso.slice(0, 10);
const daysLeft = iso => Math.ceil((new Date(iso).getTime() - Date.now()) / DAY);

const badge = (t, c = "") => `<span class="badge ${c}">${esc(t)}</span>`;
const bar = p => `<div class="bar" role="progressbar" aria-valuenow="${p}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>`;
const stars = n => "★".repeat(n) + "☆".repeat(5 - n);

const canStaff = u => u.role !== "staff";
const totalMin = c => c.lessons.reduce((s, l) => s + l.min, 0);
function prog(c, uidv) {
  const p = DB.progress.find(x => x.userId === uidv && x.courseId === c.id);
  const done = p ? p.done.length : 0;
  return { p, done, total: c.lessons.length, pct: Math.round(done / c.lessons.length * 100), complete: !!(p && p.completedAt) };
}
function prose(t) {
  return `<div class="pr">` + t.split("\n").map(l => l.startsWith("## ") ? `<h3>${esc(l.slice(3))}</h3>` : l.startsWith("- ") ? `<li>${esc(l.slice(2))}</li>` : /^\d+\.\s/.test(l) ? `<li>${esc(l.replace(/^\d+\.\s/, ""))}</li>` : l.trim() ? `<p style="margin:.2rem 0">${esc(l)}</p>` : "<br>").join("") + `</div>`;
}
function field(label, inner) { return `<label class="f">${esc(label)}${inner}</label>`; }

function tabs(items, cur) { return `<div class="row" style="margin-bottom:16px">${items.map(i => `<a class="btn s ${cur === i[0] ? "p" : ""}" href="#${i[0]}">${i[1]}</a>`).join("")}</div>`; }

/* 추천·검색·도우미 */
function recommend(u) {
  const taken = new Set(DB.applications.filter(a => a.userId === u.id && a.status !== "취소").map(a => a.eduId));
  const done = new Set(DB.progress.filter(p => p.userId === u.id && p.completedAt).map(p => p.courseId));
  const sc = t => u.interests.reduce((s, k) => s + (t.includes(k) ? 2 : 0), 0);
  const e = DB.educations.filter(x => !taken.has(x.id) && daysLeft(x.deadline) >= 0).map(x => ({ href: `#/education/${x.id}`, title: x.title, s: sc(x.title + x.desc + x.category) + (x.target === "전 직원" ? 1 : 0) }));
  const c = DB.courses.filter(x => !done.has(x.id)).map(x => ({ href: `#/courses/${x.id}`, title: x.title, s: sc(x.title + x.desc) + (x.mandatory ? 3 : 0) }));
  return [...e, ...c].sort((a, b) => b.s - a.s).slice(0, 4).map(r => ({ ...r, why: r.s >= 3 ? "필수·관심사 일치" : r.s > 0 ? "관심사와 관련" : "많은 직원이 수강" }));
}
function search(q) {
  const k = q.trim().toLowerCase(); if (!k) return [];
  const h = (...t) => t.some(x => String(x).toLowerCase().includes(k));
  return [
    ...DB.notices.map(n => ["공지", n.title, `#/notices/${n.id}`, h(n.title, n.body)]),
    ...DB.educations.map(e => ["교육", e.title, `#/education/${e.id}`, h(e.title, e.desc, e.category)]),
    ...DB.courses.map(c => ["강의", c.title, `#/courses/${c.id}`, h(c.title, c.desc)]),
    ...DB.materials.map(m => ["자료", m.title, `#/library`, h(m.title, m.desc)]),
    ...DB.posts.filter(p => !p.hidden).map(p => ["게시글", p.title, `#/board/${p.id}`, h(p.title, p.body)]),
    ...DB.ideas.map(i => ["제안", i.title, `#/ideas/${i.id}`, h(i.title, i.body)]),
    ...DB.wiki.map(w => ["위키", w.title, `#/wiki/${w.id}`, h(w.title, w.body)])
  ].filter(r => r[3]);
}
function assist(q) {
  const words = q.replace(/[?.,!]/g, " ").split(/\s+/).filter(w => w.length >= 2);
  const wiki = DB.wiki.map(w => ({ w, s: words.reduce((s, k) => s + (w.title.includes(k) ? 3 : 0) + (w.body.includes(k) ? 1 : 0), 0) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s).slice(0, 2).map(x => x.w);
  const mats = DB.materials.filter(m => words.some(k => (m.title + m.desc).includes(k))).slice(0, 2);
  return { found: wiki.length + mats.length > 0, wiki, mats };
}

/* ============ 날씨 (OpenWeather) ============ */
// 키는 index.html에 쓰지 않고 weather.config.js(window.GMON_WEATHER_KEY)에서 읽는다.
const WX_KEY = "gmon_wx_v1", WX_TTL = 10 * 60 * 1000, WX_LAT = 37.4786, WX_LON = 126.8644;
let WX = null, WXERR = null, WXBUSY = false;
const AQI = [null, ["좋음", "ok"], ["보통", ""], ["나쁨", "warn"], ["매우 나쁨", "bad"], ["최악", "bad"]];
const wxGlyph = c => c >= 200 && c < 300 ? "⛈️" : c < 400 ? "🌦️" : c < 600 ? "🌧️" : c < 700 ? "❄️" : c < 800 ? "🌫️" : c === 800 ? "☀️" : c <= 802 ? "⛅" : "☁️";
function wxHTML() {
  if (!window.GMON_WEATHER_KEY) return `<div class="lbl">GWANGMYEONG · NOW</div><span class="msg">날씨 정보는 이 배포본에서 제공되지 않습니다 (OpenWeather 키 미설정).</span>`;
  if (WX) {
    const a = AQI[WX.aqi];
    return `<div class="g" aria-hidden="true">${wxGlyph(WX.code)}</div><div><div class="lbl">GWANGMYEONG · NOW</div><div class="row" style="gap:10px;align-items:baseline"><span class="t">${WX.temp}°</span><span>${esc(WX.desc)}</span></div></div>
    <dl><div><dt>체감</dt><dd>${WX.feels}°</dd></div><div><dt>습도</dt><dd>${WX.humidity}%</dd></div><div><dt>바람</dt><dd>${WX.wind}m/s</dd></div>${a ? `<div><dt>대기질</dt><dd>${badge(a[0], a[1])}${WX.pm25 != null ? ` <span class="muted xs">PM2.5 ${WX.pm25} · PM10 ${WX.pm10}</span>` : ""}</dd></div>` : ""}</dl>
    <div class="sp xs muted row">${new Date(WX.at).toTimeString().slice(0, 5)} 기준 ${actBtn("wxRefresh", {}, "새로고침", "s")}</div>`;
  }
  if (WXERR) return `<div class="lbl">GWANGMYEONG · NOW</div><span class="msg">${esc(WXERR)}</span><span class="sp">${actBtn("wxRefresh", {}, "다시 시도", "s")}</span>`;
  return `<div class="lbl">GWANGMYEONG · NOW</div><span class="msg">날씨를 불러오는 중…</span>`;
}
function wxPaint() { const el = document.getElementById("wx"); if (el) el.innerHTML = wxHTML(); }
async function loadWeather() {
  const key = window.GMON_WEATHER_KEY;
  if (!key || WXBUSY) return;
  if (!WX) { try { const c = JSON.parse(localStorage.getItem(WX_KEY)); if (c && Date.now() - c.at < WX_TTL) WX = c.data; } catch {} }
  if (WX && Date.now() - new Date(WX.at).getTime() < WX_TTL) { wxPaint(); return; }
  WXBUSY = true; WXERR = null;
  const ctl = new AbortController(), timer = setTimeout(() => ctl.abort(), 8000);
  try {
    const q = `lat=${WX_LAT}&lon=${WX_LON}&appid=${encodeURIComponent(key)}`;
    const [w, a] = await Promise.all([
      fetch(`https://api.openweathermap.org/data/2.5/weather?${q}&units=metric&lang=kr`, { signal: ctl.signal }),
      fetch(`https://api.openweathermap.org/data/2.5/air_pollution?${q}`, { signal: ctl.signal }).catch(() => null)
    ]);
    if (w.status === 401) throw new Error("API 키가 올바르지 않거나 아직 활성화되지 않았습니다. 새로 발급한 키는 최대 2시간 뒤부터 사용할 수 있습니다.");
    if (w.status === 429) throw new Error("호출 한도를 넘었습니다. 잠시 후 다시 시도해 주세요.");
    if (!w.ok) throw new Error("날씨 서버 응답 오류 (" + w.status + ")");
    const wj = await w.json(), aj = a && a.ok ? await a.json() : null, air = aj && aj.list && aj.list[0];
    WX = { temp: Math.round(wj.main.temp), feels: Math.round(wj.main.feels_like), desc: (wj.weather[0] || {}).description || "", code: (wj.weather[0] || {}).id || 800, humidity: wj.main.humidity, wind: Math.round((wj.wind || {}).speed * 10) / 10 || 0, aqi: air ? air.main.aqi : null, pm25: air ? Math.round(air.components.pm2_5) : null, pm10: air ? Math.round(air.components.pm10) : null, at: new Date().toISOString() };
    try { localStorage.setItem(WX_KEY, JSON.stringify({ at: Date.now(), data: WX })); } catch {}
  } catch (e) {
    WXERR = e.name === "AbortError" ? "날씨 서버 응답이 늦습니다. 잠시 후 다시 시도해 주세요." : (e.message && !/fetch/i.test(e.message) ? e.message : "날씨를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.");
  } finally { clearTimeout(timer); WXBUSY = false; wxPaint(); }
}

    e.preventDefault();
    const text = q.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true; q.value = "";
    add("me", text);
    hist.push({ role: "user", content: text });
    if (!/^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.protocol !== "file:") {
      hist.pop();
      add("bot err", "이 배포본에서는 챗봇이 꺼져 있습니다. 챗봇은 키를 보호하기 위해 내 PC에서 프록시(chat-proxy.js)를 실행했을 때만 동작합니다.");
      busy = false; send.disabled = false; q.focus();
      return;
    }
    const wait = add("bot wait", "답변을 만드는 중…");
    try {
      const r = await fetch(URL_CHAT + "/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ messages: hist.slice(-10) })
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.reply) throw new Error(j.error || "응답을 받지 못했습니다.");
      wait.className = "chat-m bot"; wait.textContent = j.reply;
      hist.push({ role: "assistant", content: j.reply });
    } catch (err) {
      hist.pop();
      wait.className = "chat-m bot err";
      wait.textContent = err instanceof TypeError
        ? "챗봇 서버에 연결할 수 없습니다. 터미널에서 'node chat-proxy.js'를 실행한 뒤 다시 시도해 주세요."
        : err.message;
    }
    busy = false; send.disabled = false; log.scrollTop = log.scrollHeight; q.focus();
  };
})();
</script>
</body>
</html>
